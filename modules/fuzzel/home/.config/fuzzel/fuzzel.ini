# fuzzel: app launcher (SUPER) and every menu (clipboard, emoji, windows, session, wallpapers).
# Colors are in colors.ini, which matugen rewrites from the wallpaper.
include=~/.config/fuzzel/colors.ini

[main]
font=Noto Sans:size=12,JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
icon-theme=Adwaita
icons-enabled=yes
terminal=kitty -1
layer=overlay
width=38
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
line-height=22
fields=filename,name,generic,keywords
match-mode=fzf
show-actions=no
exit-on-keyboard-focus-loss=yes

[border]
width=1
radius=16

[key-bindings]
cancel=Escape Control+g
