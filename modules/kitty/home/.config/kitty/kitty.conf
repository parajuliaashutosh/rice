# Theming
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
window_margin_width 21.75

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell zsh

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# ─────────────────────────────────────────────────────────────────────────────
#  Tokyo Night — placed after the quickshell include so these win.
#  Delete this whole block to fall back to the generated theme.
# ─────────────────────────────────────────────────────────────────────────────
background                  #1a1b26
foreground                  #c0caf5
cursor                      #c0caf5
cursor_text_color           #1a1b26
cursor_shape                beam
cursor_beam_thickness       1.8
cursor_blink_interval       0.6

selection_background        #283457
selection_foreground        #c0caf5

url_color                   #73daca
url_style                   curly

# black
color0                      #15161e
color8                      #414868
# red
color1                      #f7768e
color9                      #f7768e
# green
color2                      #9ece6a
color10                     #9ece6a
# yellow
color3                      #e0af68
color11                     #e0af68
# blue
color4                      #7aa2f7
color12                     #7aa2f7
# magenta
color5                      #bb9af7
color13                     #bb9af7
# cyan
color6                      #7dcfff
color14                     #7dcfff
# white
color7                      #a9b1d6
color15                     #c0caf5
# extended
color16                     #ff9e64
color17                     #db4b4b

active_border_color         #7aa2f7
inactive_border_color       #292e42

# Active tab is the bright blue one; the rest recede into the background.
active_tab_background       #7aa2f7
active_tab_foreground       #16161e
active_tab_font_style       bold
inactive_tab_background     #292e42
inactive_tab_foreground     #737aa2
inactive_tab_font_style     normal
tab_bar_background          #16161e
tab_bar_style               powerline
tab_powerline_style         angled

window_padding_width        6

# ─────────────────────────────────────────────────────────────────────────────
#  Tabs — SUPER+Enter runs hypr/hyprland/scripts/kitty_tab.sh, which opens a
#  tab in the kitty on the current workspace instead of tiling a new window.
#  It talks to kitty over this socket ({kitty_pid} lets it find the right one).
#  Browser-style: ctrl+t new tab · alt+1..9 jump to tab · ctrl+tab / ctrl+shift+tab
#  switch · ctrl+w close tab (use alt+backspace to delete a word instead)
# ─────────────────────────────────────────────────────────────────────────────
allow_remote_control        socket-only
listen_on                   unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}
tab_bar_min_tabs            1

map ctrl+t                  new_tab
map ctrl+w                  close_tab
map alt+1                   goto_tab 1
map alt+2                   goto_tab 2
map alt+3                   goto_tab 3
map alt+4                   goto_tab 4
map alt+5                   goto_tab 5
map alt+6                   goto_tab 6
map alt+7                   goto_tab 7
map alt+8                   goto_tab 8
map alt+9                   goto_tab 9
