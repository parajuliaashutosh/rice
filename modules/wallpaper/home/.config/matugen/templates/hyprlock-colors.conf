# Generated by matugen from the wallpaper (template: ~/.config/matugen/templates/hyprlock-colors.conf)
$background_image = {{image}}
$background_color = rgba({{colors.surface.default.hex_stripped}}ff)
$text_color = rgba({{colors.on_surface.default.hex_stripped}}ff)
$subtext_color = rgba({{colors.on_surface_variant.default.hex_stripped}}ff)
$accent_color = rgba({{colors.primary.default.hex_stripped}}ff)
$card_color = rgba({{colors.surface.default.hex_stripped}}88)
$card_border_color = rgba({{colors.outline_variant.default.hex_stripped}}66)
$entry_background_color = rgba({{colors.surface_container_high.default.hex_stripped}}66)
$entry_border_color = rgba({{colors.primary.default.hex_stripped}}77)
$entry_color = rgba({{colors.on_surface.default.hex_stripped}}ff)
$font_family = JetBrainsMono Nerd Font
$font_family_clock = JetBrainsMono Nerd Font
