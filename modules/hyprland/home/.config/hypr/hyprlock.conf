# Colors and the current wallpaper come from matugen (wallpaper module); the hyprland module
# installs a fallback copy so the lock screen works before the first wallpaper is set.
source = ~/.config/hypr/hyprlock/colors.conf

$scripts = ~/.config/hypr/hyprlock

general {
    hide_cursor = false
    ignore_empty_input = true
}

# Sharp wallpaper, slightly darkened so the text stays readable
background {
    monitor =
    path = $background_image
    color = $background_color
    brightness = 0.75
    blur_passes = 0
}

# Frosted card behind the clock, dates and password field
shape {
    monitor =
    size = 420, 380
    color = $card_color
    rounding = 28
    border_size = 1
    border_color = $card_border_color
    position = 0, 40
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = $TIME
    color = $text_color
    font_size = 72
    font_family = $font_family_clock
    position = 0, 150
    halign = center
    valign = center
}

label { # Date (English)
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $text_color
    font_size = 16
    font_family = $font_family
    position = 0, 70
    halign = center
    valign = center
}

label { # Date (Nepali, Bikram Sambat)
    monitor =
    text = cmd[update:60000] ~/.config/waybar/scripts/nepali-date.sh --plain
    color = $subtext_color
    font_size = 15
    font_family = $font_family
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    check_color = $accent_color
    fail_color = rgba(e06c75ff)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    rounding = 14
    position = 0, -50
    halign = center
    valign = center
}

label { # Caps Lock warning
    monitor =
    text = cmd[update:250] $scripts/check-capslock.sh
    color = $accent_color
    font_size = 13
    font_family = $font_family
    position = 0, -100
    halign = center
    valign = center
}

label { # User
    monitor =
    text =     $USER
    color = $text_color
    font_size = 18
    font_family = $font_family
    position = 0, 50
    halign = center
    valign = bottom
}

label { # Battery / layout
    monitor =
    text = cmd[update:5000] $scripts/status.sh
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = 30, -30
    halign = left
    valign = top
}

label {
    monitor =
    text = $LAYOUT
    color = $text_color
    font_size = 14
    font_family = $font_family
    position = 30, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰐥
    color = $subtext_color
    font_size = 20
    font_family = $font_family
    onclick = systemctl poweroff
    position = -40, 36
    halign = right
    valign = bottom
}
label {
    monitor =
    text = 󰜉
    color = $subtext_color
    font_size = 20
    font_family = $font_family
    onclick = systemctl reboot
    position = -96, 36
    halign = right
    valign = bottom
}
label {
    monitor =
    text = 󰤄
    color = $subtext_color
    font_size = 20
    font_family = $font_family
    onclick = systemctl suspend
    position = -152, 36
    halign = right
    valign = bottom
}
label {
    monitor =
    text = 󰀙
    color = $subtext_color
    font_size = 20
    font_family = $font_family
    onclick = $scripts/switch-user.sh
    position = -208, 36
    halign = right
    valign = bottom
}
